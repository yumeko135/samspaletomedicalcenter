<style>
/* Layout : en-tête marine pleine largeur, contenu centré 1180px, espaces en barre latérale + panneau. */
:root{
  --navy:#0d2645; --navy-2:#16395f; --glacier:#9fd2ec; --ice:#e7f3fa;
  --bg:#f4f8fb; --surface:#ffffff; --surface-2:#eef4f9; --line:#d5e2ec;
  --fg:#0f2238; --muted:#566c83; --accent:#1f6fa8; --accent-fg:#ffffff;
  --ok:#1d8a5a; --ok-bg:#e3f4ec; --warn:#b06d0b; --warn-bg:#fbf0dc; --err:#c23a3a; --err-bg:#fbe6e6;
  --shadow:0 1px 2px rgba(13,38,69,.06),0 8px 24px rgba(13,38,69,.06);
  --f-display:"Red Hat Display",system-ui,sans-serif;
  --f-body:"Red Hat Text",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
  --f-sign:"Great Vibes","Brush Script MT",cursive;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --navy:#081a30; --navy-2:#11304f; --glacier:#8fcaea; --ice:#12304d;
  --bg:#0a1624; --surface:#0f2135; --surface-2:#132a42; --line:#21405e;
  --fg:#e5f0f8; --muted:#93aac0; --accent:#7cc0e6; --accent-fg:#06192b;
  --ok:#5fcf9a; --ok-bg:#123527; --warn:#e9b45a; --warn-bg:#3a2a10; --err:#f08080; --err-bg:#3d1818;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --navy:#081a30; --navy-2:#11304f; --glacier:#8fcaea; --ice:#12304d;
  --bg:#0a1624; --surface:#0f2135; --surface-2:#132a42; --line:#21405e;
  --fg:#e5f0f8; --muted:#93aac0; --accent:#7cc0e6; --accent-fg:#06192b;
  --ok:#5fcf9a; --ok-bg:#123527; --warn:#e9b45a; --warn-bg:#3a2a10; --err:#f08080; --err-bg:#3d1818;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--navy)}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--glacier);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-size:.86em}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.eyebrow{font-family:var(--f-display);font-weight:700;font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}

/* En-tête */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--navy);color:#fff;border-bottom:1px solid rgba(159,210,236,.18)}
.top .wrap{display:flex;align-items:center;gap:18px;min-height:68px}
.brand{display:flex;align-items:center;gap:12px;text-align:left;text-decoration:none;color:#fff;cursor:pointer;background:none;border:0;padding:0}
.brand img{width:46px;height:46px}
.brand b{font-family:var(--f-display);font-size:1.15rem;letter-spacing:.06em;display:block;line-height:1}
.brand span{font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:#9fd2ec}
.nav{display:flex;gap:4px;margin-left:auto;align-items:center;flex-wrap:wrap}
.nav button{background:none;border:0;color:#d6e9f5;padding:8px 12px;border-radius:8px;cursor:pointer;font-weight:500}
.nav button:hover,.nav button.on{color:#fff;background:rgba(159,210,236,.14)}
.nav .cta{background:#9fd2ec;color:#0d2645;font-weight:700}
.nav .cta:hover{background:#c4e5f6;color:#0d2645}
.iconbtn{width:38px;height:38px;display:grid;place-items:center;border-radius:50%;border:1px solid rgba(159,210,236,.35);background:none;color:#d6e9f5;cursor:pointer}
.iconbtn:hover{color:#fff;border-color:#9fd2ec}
.iconbtn svg{width:18px;height:18px}
.burger{display:none}
@media (max-width:860px){
  .burger{display:grid;margin-left:auto}
  .nav{display:none;position:absolute;left:0;right:0;top:100%;background:var(--navy);flex-direction:column;align-items:stretch;padding:10px max(16px,env(safe-area-inset-left,0px)) 16px}
  .nav.open{display:flex}
  .nav button{text-align:left}
}
.banner{background:var(--warn-bg);color:var(--warn);font-size:.85rem}
.banner .wrap{padding-block:8px}

/* Boutons, champs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;background:var(--accent);color:var(--accent-fg);padding:10px 16px;border-radius:9px;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:6px 11px;font-size:.86rem;border-radius:7px}
.btn.danger{background:var(--err);color:#fff}
.btn.ok{background:var(--ok);color:#fff}
.btn.big{padding:14px 24px;font-size:1.02rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:.84rem;font-weight:600;color:var(--muted);min-width:0}
input:not([type=checkbox]):not([type=radio]):not([type=file]),select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-weight:400;color:var(--fg)}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:640px){.grid2,.grid3{grid-template-columns:1fr}}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.spacer{flex:1}
.check{display:flex;gap:8px;align-items:center;font-size:.9rem}
.err{color:var(--err);font-size:.88rem;font-weight:600}
.hint{font-size:.8rem;color:var(--muted);font-weight:400}

/* Pills */
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:.76rem;font-weight:700;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.err{background:var(--err-bg);color:var(--err)}
.pill.info{background:var(--ice);color:var(--accent)}

/* Cartes */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}
.card h3{font-size:1.06rem;margin-bottom:4px}
.list{display:flex;flex-direction:column}
.item{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-top:1px solid var(--line);min-width:0}
.item:first-child{border-top:0}
.item .grow{flex:1;min-width:0}
.empty{padding:28px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r);font-size:.92rem}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th{text-align:left;font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}

/* Accueil */
.hero{position:relative;background:var(--navy);color:#fff;overflow:hidden}
.hero .photo{position:absolute;inset:0;background-size:cover;background-position:center 40%}
.hero .photo::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,26,48,.9) 0%,rgba(8,26,48,.55) 42%,rgba(8,26,48,0) 75%)}
.hero .wrap{position:relative;padding-block:96px 88px}
.hero h1{font-size:clamp(2.1rem,5vw,3.6rem);max-width:15ch;font-weight:800;letter-spacing:-.01em}
.hero p{max-width:52ch;margin-top:18px;color:#d3e7f3;font-size:1.08rem}
.hero .row{margin-top:30px}
.hero .chip{display:inline-flex;gap:8px;align-items:center;font-size:.8rem;color:#9fd2ec;border:1px solid rgba(159,210,236,.35);padding:5px 12px;border-radius:99px;margin-bottom:22px}
.hero .chip i{width:7px;height:7px;border-radius:50%;background:#5fcf9a;display:block}
.photo-cap{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:12px;font-size:.72rem;color:rgba(255,255,255,.6);z-index:1}
.section{padding-block:64px}
.section h2{font-size:clamp(1.6rem,3vw,2.2rem);margin-top:8px}
.split{display:grid;grid-template-columns:1.1fr 1fr;gap:48px;align-items:center}
@media (max-width:820px){.split{grid-template-columns:1fr;gap:28px}}
.prose{max-width:62ch;display:flex;flex-direction:column;gap:14px;color:var(--fg)}
.prose p{white-space:pre-line}
.hall{aspect-ratio:4/3;max-width:100%;border-radius:14px;background-size:cover;background-position:center;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:28px}
@media (max-width:760px){.steps{grid-template-columns:1fr}}
.step{padding:22px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.step .n{font-family:var(--f-display);font-weight:800;font-size:1.5rem;color:var(--accent)}
.svc{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-top:24px}
.svc button{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:13px 15px;cursor:pointer;font-weight:600;display:flex;justify-content:space-between;gap:8px;align-items:center}
.svc button:hover{border-color:var(--accent);color:var(--accent)}
.pro-band{background:var(--navy-2);color:#fff;border-radius:16px;padding:32px;display:flex;gap:24px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.pro-band p{color:#cfe4f1;max-width:55ch;margin-top:6px}
footer{border-top:1px solid var(--line);margin-top:40px}
footer .wrap{padding-block:28px;display:flex;gap:18px;flex-wrap:wrap;justify-content:space-between;color:var(--muted);font-size:.86rem}

/* Qui sommes-nous */
.pageband{background:linear-gradient(180deg,var(--navy) 0%,var(--navy-2) 100%);color:#fff}
.pageband .wrap{padding-block:56px 48px}
.pageband h1{font-size:clamp(1.9rem,4vw,2.8rem)}
.pageband p{color:#cfe4f1;max-width:60ch;margin-top:12px;white-space:pre-line}
.figures{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:-28px;position:relative;max-width:560px}
.sos{color:#e03131;font-weight:800}
.figures .card{box-shadow:var(--shadow)}
.figures b{font-family:var(--f-display);font-size:2rem;display:block;color:var(--accent)}
.team-group{margin-top:36px}
.team-group h3{font-size:1.15rem;padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:16px}
.team{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.member{display:flex;gap:14px;align-items:flex-start}
.avatar{width:64px;height:64px;border-radius:50%;flex:none;background:var(--ice);color:var(--accent);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.2rem;background-size:cover;background-position:center}
.avatar.sm{width:34px;height:34px;font-size:.8rem}

/* Recrutement */
/* Bannière recrutement : toujours sur fond nuit, comme l'affiche du SAMS */
.recruit{position:relative;overflow:hidden;border-radius:14px;background:#0b1a2e;border:1px solid #1d3555;color:#fff;display:flex;flex-direction:column;align-items:center;text-align:center;padding:30px 24px 34px;gap:14px}
.recruit img{width:100px;height:100px;position:relative}
.recruit h1{font-family:"Archivo Black","Arial Black",Impact,var(--f-display);font-weight:400;font-size:clamp(2.4rem,7vw,4.4rem);color:#7cc4f0;letter-spacing:.01em;line-height:1;position:relative}
.recruit .state{font-family:"Archivo Black","Arial Black",Impact,var(--f-display);font-size:clamp(1.8rem,5vw,2.6rem);line-height:1;padding:14px 36px;color:#fff;position:relative}
.recruit .state.closed{background:#d92626}
.recruit .state.open{background:#1e9e55}
.recruit .bar{width:60px;height:3px;background:#3aa6f5;margin-top:10px;position:relative}
.recruit p{color:#a9cbe6;font-size:.9rem;position:relative}
.rc{position:absolute;width:200px;height:200px;pointer-events:none}
.rc i{position:absolute;inset:0}
.rc .a{background:#3aa6f5;clip-path:polygon(0 0,100% 0,100% 6%,6% 100%,0 100%)}
.rc .b{background:#05101d;clip-path:polygon(0 0,70% 0,0 70%)}
.rc .c{background:#0d4a8a;clip-path:polygon(0 0,62% 0,0 62%)}
.rc-tl{top:0;left:0}
.rc-br{bottom:0;right:0;transform:rotate(180deg)}
@media (max-width:640px){.rc{width:110px;height:110px}.recruit{padding-top:40px}}

/* Auth */
.authbox{max-width:460px;margin:48px auto}
.authbox .card{padding:28px}
.authhead{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;margin-bottom:20px}
.authhead img{width:84px;height:84px}
.tabs{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:10px;margin-bottom:18px;flex-wrap:wrap}
.tabs button{flex:1;border:0;background:none;padding:8px 10px;border-radius:7px;cursor:pointer;font-weight:600;color:var(--muted)}
.tabs button.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}

/* Espace connecté */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);gap:28px;padding-block:28px 40px}
@media (max-width:900px){.app{grid-template-columns:1fr}}
.side{display:flex;flex-direction:column;gap:2px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px);align-self:start}
.side .who{display:flex;gap:10px;align-items:center;padding:4px 8px 16px;border-bottom:1px solid var(--line);margin-bottom:10px}
.side .who b{display:block;font-family:var(--f-display);line-height:1.2}
.side h5{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:14px 10px 4px;font-family:var(--f-display)}
.side button{display:flex;gap:10px;align-items:center;text-align:left;background:none;border:0;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--fg);font-weight:500}
.side button svg{width:17px;height:17px;flex:none;opacity:.75}
.side button:hover{background:var(--surface-2)}
.side button.on{background:var(--ice);color:var(--accent);font-weight:700}
.side button .badge{margin-left:auto;background:var(--accent);color:var(--accent-fg);border-radius:99px;font-size:.7rem;padding:0 7px;font-weight:700}
@media (max-width:900px){
  .side{position:static;flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:6px}
  .side .who,.side h5{display:none}
  .side button{white-space:nowrap;flex:none}
}
.panelhead{display:flex;gap:12px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:20px}
.panelhead h2{font-size:1.6rem}
.subtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.subtabs button{background:none;border:0;border-bottom:2px solid transparent;padding:9px 12px;cursor:pointer;font-weight:600;color:var(--muted);white-space:nowrap}
.subtabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi span{font-size:.76rem;color:var(--muted);font-weight:600}
.kpi b{display:block;font-family:var(--f-display);font-size:1.45rem;font-variant-numeric:tabular-nums}
.kpi.neg b{color:var(--err)} .kpi.pos b{color:var(--ok)}
.bars{display:flex;gap:8px;align-items:flex-end;height:130px;padding-top:10px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;height:100%;justify-content:flex-end}
.bars .b i{display:block;width:100%;max-width:42px;background:var(--glacier);border-radius:5px 5px 0 0;min-height:2px}
.bars .b.cur i{background:var(--accent)}
.bars .b small{font-size:.68rem;color:var(--muted)}
.thread{display:flex;flex-direction:column;gap:10px;max-height:420px;overflow-y:auto;padding:6px 2px}
.msg{max-width:78%;padding:9px 13px;border-radius:12px;background:var(--surface-2);align-self:flex-start;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-fg)}
.msg small{display:block;opacity:.7;font-size:.72rem;margin-top:3px}
.convs{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px}
@media (max-width:760px){.convs{grid-template-columns:1fr}}
.convs .lst button{display:block;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:8px;padding:9px 11px;cursor:pointer}
.convs .lst button.on{background:var(--ice);border-color:var(--line)}
.post{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;background:var(--surface)}
.post .body{white-space:pre-wrap;margin-top:6px;overflow-wrap:anywhere}
.post .replies{margin-top:10px;padding-left:14px;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:8px}
.atts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.atts img{max-height:140px;border-radius:8px;border:1px solid var(--line);cursor:zoom-in}
.att-file{display:inline-flex;gap:6px;align-items:center;padding:6px 10px;border:1px solid var(--line);border-radius:8px;font-size:.84rem;background:var(--surface-2);cursor:pointer}
.dossierhead{display:flex;gap:16px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
.fiche{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.fiche div{background:var(--surface-2);border-radius:8px;padding:10px 12px;min-width:0}
.fiche span{display:block;font-size:.72rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.fiche b{font-weight:600;white-space:pre-wrap;overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips label{display:inline-flex;gap:6px;align-items:center;padding:5px 10px;border:1px solid var(--line);border-radius:99px;font-size:.84rem;cursor:pointer;background:var(--surface)}
.chips label:has(input:checked){background:var(--ice);border-color:var(--accent);color:var(--accent)}

/* Modale */
.modal{position:fixed;inset:0;z-index:100;background:rgba(5,15,28,.55);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:calc(24px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px))}
.modal .box{background:var(--surface);border-radius:14px;width:100%;max-width:640px;box-shadow:0 20px 60px rgba(0,0,0,.3);padding:24px;margin:auto 0}
.modal .box.wide{max-width:920px}
.modal .mhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.modal .mhead h3{font-size:1.25rem}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:9px;z-index:200;font-weight:600;font-size:.9rem;box-shadow:var(--shadow)}

/* Document officiel (toujours clair, comme du papier) */
.sheetwrap{overflow-x:auto;background:#cfd9e2;padding:18px;border-radius:10px}
.sheet{width:794px;min-height:1123px;margin:0 auto;background:#fff;color:#14263b;position:relative;padding:54px 62px 120px;font-family:var(--f-body);font-size:13.5px;line-height:1.55;overflow:hidden}
.sheet .wm{position:absolute;left:50%;top:52%;width:460px;height:460px;transform:translate(-50%,-50%);opacity:.06;pointer-events:none}
.sheet .sh{display:flex;align-items:center;gap:18px;padding-bottom:16px;border-bottom:3px solid #0d2645}
.sheet .sh img{width:92px;height:92px}
.sheet .sh h1{font-size:30px;letter-spacing:.06em;color:#0d2645;font-weight:800}
.sheet .sh .sub{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#2a7fb8;font-weight:700}
.sheet .sh .addr{margin-left:auto;text-align:right;font-size:11px;color:#4a6078}
.sheet .dtitle{margin:26px 0 6px;font-family:var(--f-display);font-size:22px;color:#0d2645;text-transform:uppercase;letter-spacing:.08em}
.sheet .ref{font-family:var(--f-mono);font-size:11px;color:#4a6078}
.sheet .pbox{margin-top:16px;border:1.5px solid #0d2645;border-radius:6px;display:grid;grid-template-columns:repeat(3,1fr)}
.sheet .pbox div{padding:8px 12px;border-right:1px solid #c9d7e3}
.sheet .pbox div:last-child{border-right:0}
.sheet .pbox span{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.12em;color:#4a6078;font-weight:700}
.sheet .pbox b{font-size:13.5px}
.sheet .content{margin-top:22px;position:relative}
.sheet .content p,.sheet .content .pre{white-space:pre-wrap}
.sheet .content h4{font-family:var(--f-display);font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:#0d2645;margin:16px 0 6px}
.sheet table th{color:#4a6078;border-bottom:1.5px solid #0d2645;font-size:10px}
.sheet table td{border-bottom:1px solid #dde6ee;padding:6px 10px}
.sheet .flag{font-weight:700;font-size:11px;padding:1px 8px;border-radius:99px}
.sheet .flag.n{background:#e3f4ec;color:#1d7a50}.sheet .flag.l{background:#e4eefb;color:#2456a6}.sheet .flag.h{background:#fbe6e6;color:#b52f2f}
.sheet .imgs{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}
.sheet .imgs img{width:100%;border:1px solid #c9d7e3;border-radius:4px;background:#000}
.sheet .signzone{display:flex;justify-content:space-between;align-items:flex-end;margin-top:40px}
.sheet .sign{text-align:center;min-width:240px}
.sheet .sign .cur{font-family:var(--f-sign);font-size:40px;color:#123a6b;line-height:1.1;transform:rotate(-4deg);display:inline-block}
.sheet .sign .line{border-top:1px solid #6b7f94;margin-top:2px;padding-top:4px;font-size:11px;color:#4a6078}
.sheet .stamp{width:132px;height:132px;transform:rotate(-12deg);opacity:.85}
.sheet .sf{position:absolute;left:62px;right:62px;bottom:34px;border-top:1px solid #c9d7e3;padding-top:10px;font-size:10px;color:#4a6078;display:flex;justify-content:space-between;gap:12px}

.lightbox img{max-width:100%;border-radius:8px}
@media print{
  body *{visibility:hidden}
  .sheet,.sheet *{visibility:visible}
  .sheet{position:absolute;left:0;top:0;margin:0}
  .modal{position:static;background:none;padding:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

async function initStore(){
  let db = null;
  if (window.claude && typeof window.claude.use === "function") {
    try { db = await Promise.race([window.claude.use("db"), new Promise(r => setTimeout(() => r(null), 10000))]); } catch(e) { db = null; }
  }
  if (db) {
    DB = db; backend = "db";
    let pending = COLS.length;
    const done = () => { if (--pending === 0) { ready = true; } scheduleRender(); };
    COLS.forEach(c => {
      let first = true;
      db.collection(c).onSnapshot(snap => {
        const o = {}; snap.docs.forEach(d => { o[d.id] = d.data(); });
        S[c] = o;
        if (first) { first = false; done(); } else scheduleRender();
      }, err => {
        console.warn("db", c, err);
        if (first) { first = false; done(); }
      });
    });
  } else {
    backend = "local";
    const raw = lsGet(LKEY);
    if (raw) { try { const d = JSON.parse(raw); COLS.forEach(c => S[c] = d[c] || {}); } catch(e){} }
    ready = true; render();
  }
}

function put(col, id, obj){

/* Semaine ISO (lundi → dimanche). Semaine 43 de 2026 = 19/10 → 25/10. */
function weekOf(v){
  const d = /^\d{4}-\d{2}-\d{2}$/.test(v || "") ? new Date(v + "T12:00") : (v ? toDate(v) : new Date());
  const day = (d.getDay() + 6) % 7;
  const start = new Date(d); start.setHours(0,0,0,0); start.setDate(d.getDate() - day);
  const end = new Date(start); end.setDate(start.getDate() + 6);
  const th = new Date(start); th.setDate(start.getDate() + 3);
  const year = th.getFullYear();
  const jan4 = new Date(year, 0, 4); const w1 = new Date(jan4); w1.setDate(jan4.getDate() - ((jan4.getDay() + 6) % 7));
  const week = Math.round((start - w1) / 604800000) + 1;
  return {year, week, start, end, key: year + "-W" + pad(week)};
}
function shiftWeek(w, n){ const d = new Date(w.start); d.setDate(d.getDate() + 7*n + 2); return weekOf(d); }

async function hash(user, pw){
  const txt = "sams:" + user + ":" + pw;
  try {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(txt));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
  } catch(e) {
    let h = 5381; for (let i = 0; i < txt.length; i++) h = ((h << 5) + h + txt.charCodeAt(i)) | 0; return "f" + (h >>> 0).toString(16);
  }
}

function readFile(file){ return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); }); }
async function compressImage(file, max, q){
  const url = await readFile(file);
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      res(c.toDataURL("image/jpeg", q || .78));
    };
    img.onerror = () => res(null);
    img.src = url;
  });
}
async function fileToAtt(file){
  if (file.type.startsWith("image/")) { const data = await compressImage(file, 1280, .76); return data ? {kind:"image", name:file.name, data} : null; }

}

    app.querySelectorAll("input[id],select[id],textarea[id]").forEach(el => {
      if (el.type === "file") return;
      saved[el.id] = (el.type === "checkbox" || el.type === "radio") ? {c: el.checked} : {v: el.value};
    });
    const a = document.activeElement;
    if (a && a.id && app.contains(a)) focus = {id: a.id, s: a.selectionStart, e: a.selectionEnd};
    app.querySelectorAll(".thread[id]").forEach(el => scrolls[el.id] = el.scrollHeight - el.scrollTop - el.clientHeight);
  }
  app.innerHTML = page();
  if (saved) {
    for (const id in saved) {
      const el = document.getElementById(id);
      if (!el || el.hasAttribute("data-nokeep")) continue;
      if ("c" in saved[id]) el.checked = saved[id].c; else el.value = saved[id].v;
    }
    if (focus) { const el = document.getElementById(focus.id); if (el) { el.focus({preventScroll: true}); try { el.setSelectionRange(focus.s, focus.e); } catch(e){} } }
  }
  app.querySelectorAll(".thread").forEach(el => { const d = scrolls[el.id]; if (d == null || d < 40) el.scrollTop = el.scrollHeight; });
}

async function compressTo(file, max, limit){
  const url = await readFile(file);
  const img = await new Promise(r => { const i = new Image(); i.onload = () => r(i); i.onerror = () => r(null); i.src = url; });
  if (!img) return null;
  let m = max;
  for (let k = 0; k < 8; k++) {
    const s = Math.min(1, m / Math.max(img.width, img.height));
    const c = document.createElement("canvas"); c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    for (const q of [.82, .72, .62, .52]) { const d = c.toDataURL("image/jpeg", q); if (d.length <= limit) return d; }
    m = Math.round(m * .75);
  }
  return null;
}

function unreadCount(u){
  return all("messages").filter(c => (c.patient === u.id || c.pro === u.id)).filter(c => { const l = (c.msgs || []).slice(-1)[0]; return l && l.from !== u.id && l.at > ((c.read || {})[u.id] || 0); }).length;
}

function head(title, actions, sub){ return `<div class="panelhead"><div><h2>${esc(title)}</h2>${sub ? `<p class="muted small" style="margin-top:4px">${esc(sub)}</p>` : ""}</div><div class="row">${actions || ""}</div></div>`; }
function subtabs(items, cur, attrs){ return `<div class="subtabs" role="tablist">${items.map(([k, l]) => `<button role="tab" aria-selected="${k === cur}" class="${k === cur ? "on" : ""}" data-act="sub" data-sub="${k}" ${attrs || ""}>${l}</button>`).join("")}</div>`; }

/* ---------- Mot de passe provisoire ---------- */
function forcedPw(u){

/* ---------- Espace patient ---------- */
function rdvWhen(a){
  if (a.status === "confirme") return `${fmtDL(a.date)} à ${esc(a.time || "?")}`;
  return `${fmtDL(a.date)} · ${SLOTS[a.slot] || ""}`;
}
function pRdv(p){
  const list = all("appointments").filter(a => a.patient === p.id && !a.hiddenForPatient).sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  if (!list.length) return `<div class="empty">Aucun rendez-vous. <button class="btn sm" data-act="go" data-p="rdv">Prendre rendez-vous</button></div>`;
  return `<div class="card list">${list.map(a => {
    const past = a.date < today();
    const canCancel = ["demande", "propose", "confirme"].includes(a.status) && !past;
    const canHide = ["annule", "refuse", "decline"].includes(a.status) || past;
    return `<div class="item"><div class="grow"><div class="row">${stPill(a.status)}<b>${esc(specName(a.spec))}</b><span class="muted small">${RDV_TYPES[a.type] || ""}</span></div>
      <div style="margin-top:4px;font-weight:600">${rdvWhen(a)}${a.soignant ? ` <span class="muted" style="font-weight:400">avec ${esc(nameOf(a.soignant))}</span>` : ""}</div>
      <p class="muted small" style="margin-top:4px">${esc(a.reason)}</p>
      ${a.status === "propose" ? `<div class="card" style="margin-top:10px;background:var(--ice);border-color:transparent;padding:14px"><b>Nouveau créneau proposé : ${fmtDL(a.propDate)} à ${esc(a.propTime)}</b>${a.note ? `<p class="small" style="margin-top:4px">${esc(a.note)}</p>` : ""}
        <div class="row" style="margin-top:10px"><button class="btn sm ok" data-act="propAccept" data-id="${a.id}">Accepter ce créneau</button><button class="btn sm ghost" data-act="propRefuse" data-id="${a.id}">Refuser</button></div></div>` : ""}
      ${a.status === "refuse" && a.note ? `<p class="small" style="margin-top:6px">Motif : ${esc(a.note)}</p>` : ""}
      </div><div class="row">${canCancel ? `<button class="btn sm ghost" data-act="rdvCancel" data-id="${a.id}">Annuler</button>` : ""}${canHide ? `<button class="btn sm ghost" data-act="rdvHide" data-id="${a.id}">Retirer</button>` : ""}</div></div>`;
  }).join("")}</div>`;
}
const logPush = (a, text) => (a.log || []).concat([{at: Date.now(), by: session, text}]);
ACT.rdvCancel = t => confirmBox("Annuler ce rendez-vous ?", "Le service sera prévenu de l'annulation.", "Annuler le rendez-vous", () => { const a = S.appointments[t.dataset.id]; patch("appointments", t.dataset.id, {status: "annule", log: logPush(a, "Annulé par " + nameOf(session))}); toast("Rendez-vous annulé."); });
ACT.rdvHide = t => confirmBox("Retirer ce rendez-vous de votre espace ?", "Il disparaît de votre liste. L'hôpital en garde la trace dans votre dossier.", "Retirer", () => { patch("appointments", t.dataset.id, {hiddenForPatient: true}); toast("Rendez-vous retiré de votre espace."); });
ACT.propAccept = t => { const a = S.appointments[t.dataset.id]; patch("appointments", t.dataset.id, {status: "confirme", date: a.propDate, time: a.propTime, log: logPush(a, "Créneau proposé accepté par le patient")}); toast("Rendez-vous confirmé."); };
ACT.propRefuse = t => { const a = S.appointments[t.dataset.id]; patch("appointments", t.dataset.id, {status: "decline", log: logPush(a, "Créneau proposé refusé par le patient")}); toast("Créneau refusé. Vous pouvez faire une nouvelle demande."); };

function pDocs(p){
  const list = all("documents").filter(d => d.patient === p.id && d.visibleToPatient && !d.removedByPatient).sort((a, b) => b.at - a.at);
  if (!list.length) return `<div class="empty">Aucun document pour le moment. Vos ordonnances, certificats et comptes rendus apparaîtront ici.</div>`;
  return `<div class="card list">${list.map(d => `<div class="item"><div class="avatar sm" style="border-radius:8px">${ICONS.doc}</div><div class="grow"><b>${esc(DOC_TYPES[d.type].label)}</b><div class="small muted">${fmtD(d.at)} · ${esc(nameOf(d.author))} · <span class="mono">${esc(d.ref)}</span></div></div>
    <div class="row"><button class="btn sm" data-act="viewDoc" data-id="${d.id}">Ouvrir</button><button class="btn sm ghost" data-act="docRemove" data-id="${d.id}">Retirer</button></div></div>`).join("")}</div>`;
}
ACT.docRemove = t => confirmBox("Retirer ce document de votre espace ?", "Il ne sera plus visible ici. Il reste dans votre dossier médical à l'hôpital.", "Retirer", () => { patch("documents", t.dataset.id, {removedByPatient: true}); toast("Document retiré de votre espace."); });

function pBill(p){
  const list = all("billing").filter(b => b.patient === p.id).sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  const due = list.filter(b => !b.paid).reduce((s, b) => s + (+b.amount || 0), 0), paid = list.filter(b => b.paid).reduce((s, b) => s + (+b.amount || 0), 0);

}
function ficheGrid(m){
  m = m || {};
  const f = [["Date de naissance", fmtD(m.naissance)], ["Groupe sanguin", m.groupe || "—"], ["Taille", m.taille ? m.taille + " cm" : "—"], ["Poids", m.poids ? m.poids + " kg" : "—"], ["Allergies", m.allergies || "Aucune connue"], ["Antécédents", m.antecedents || "—"], ["Contact d'urgence", m.urgence || "—"]];

function pFiche(p){

}
function myPatientView(u){
  const sub = ["rdv", "docs", "msgs", "bill", "fiche"].includes(V.sub) ? V.sub : "rdv";
  const tabs = subtabs([["rdv", "Rendez-vous"], ["docs", "Documents"], ["msgs", "Messages"], ["bill", "Facturation"], ["fiche", "Fiche médicale"]], sub);

}

/* ---------- Messagerie patient ↔ professionnel ---------- */
function convView(u, side){
  const mine = all("messages").filter(c => side === "patient" ? c.patient === u.id : c.pro === u.id).sort((a, b) => (b.updated || 0) - (a.updated || 0));
  const key = "conv-" + side;
  const cur = T[key] && S.messages[T[key]] ? Object.assign({id: T[key]}, S.messages[T[key]]) : null;
  const other = c => side === "patient" ? c.pro : c.patient;
  const people = side === "patient" ? staffList().filter(a => a.id !== u.id && a.role !== "admin") : all("accounts").filter(a => a.id !== u.id).sort((a, b) => fullName(a).localeCompare(fullName(b)));
  return `<div class="convs"><div class="card lst" style="padding:12px">
      <form class="stack" data-form="newConv" data-side="${side}" style="gap:8px;margin-bottom:10px"><select id="nc-${side}" name="who" required><option value="">${side === "patient" ? "Écrire à un professionnel…" : "Écrire à un patient…"}</option>${people.map(a => `<option value="${a.id}">${esc(fullName(a))}${side === "patient" ? " · " + esc(a.poste || "") : ""}</option>`).join("")}</select><button class="btn sm">Ouvrir la conversation</button></form>
      ${mine.length ? mine.map(c => { const l = (c.msgs || []).slice(-1)[0]; const un = l && l.from !== u.id && l.at > ((c.read || {})[u.id] || 0);
        return `<button class="${cur && cur.id === c.id ? "on" : ""}" data-act="openConv" data-id="${c.id}" data-key="${key}"><div class="row" style="gap:6px"><b>${esc(nameOf(other(c)))}</b>${un ? pill("Nouveau", "info") : ""}</div><div class="small muted" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${l ? esc(l.text) : "Aucun message"}</div></button>`; }).join("") : `<p class="small muted" style="padding:8px">Aucune conversation.</p>`}
    </div><div class="card" style="min-width:0">${cur ? `<div class="row" style="margin-bottom:10px">${avatar(acc(other(cur)), "sm")}<b>${esc(nameOf(other(cur)))}</b></div>
      <div class="thread" id="th-${side}">${(cur.msgs || []).map(m => `<div class="msg ${m.from === u.id ? "me" : ""}">${esc(m.text)}<small>${m.from === u.id ? "Vous" : esc(nameOf(m.from))} · ${fmtDT(m.at)}</small></div>`).join("") || `<p class="muted small">Écrivez le premier message.</p>`}</div>
      <form class="row" data-form="sendMsg" data-id="${cur.id}" style="margin-top:12px;flex-wrap:nowrap"><textarea id="ms-${side}" name="text" required style="min-height:46px" placeholder="Votre message"></textarea><button class="btn">Envoyer</button></form>`
      : `<div class="empty">Choisissez une conversation ou ouvrez-en une nouvelle.</div>`}</div></div>`;
}
FORM.newConv = (f, fd) => {
  const u = me(), side = f.dataset.side, who = fd.get("who");
  const patient = side === "patient" ? u.id : who, pro = side === "patient" ? who : u.id;
  const id = patient + "__" + pro;
  if (!S.messages[id]) put("messages", id, {patient, pro, msgs: [], updated: Date.now(), read: {}});
  T["conv-" + side] = id; render();
};
ACT.openConv = t => {
  T[t.dataset.key] = t.dataset.id; const c = S.messages[t.dataset.id]; const u = me();
  const l = (c.msgs || []).slice(-1)[0];
  if (l && l.from !== u.id && l.at > ((c.read || {})[u.id] || 0)) patch("messages", t.dataset.id, {read: Object.assign({}, c.read, {[u.id]: Date.now()})});
  else render(true);
};
FORM.sendMsg = (f, fd) => {
  const u = me(), id = f.dataset.id, c = S.messages[id], text = fd.get("text").trim(); if (!text) return;
  f.reset();
  patch("messages", id, {msgs: (c.msgs || []).concat([{from: u.id, text, at: Date.now()}]).slice(-400), updated: Date.now(), read: Object.assign({}, c.read, {[u.id]: Date.now()})});
};

/* ---------- Rendez-vous côté soignant ---------- */
function staffRdv(u){
  const specs = mySpecs(u);
  const mine = all("appointments").filter(a => specs.includes(a.spec) || a.soignant === u.id);
  const sub = ["todo", "upcoming", "proposed", "history"].includes(V.sub) ? V.sub : "todo";
  const sets = {
    todo: mine.filter(a => a.status === "demande").sort((a, b) => (a.date || "").localeCompare(b.date || "")),
    upcoming: mine.filter(a => a.status === "confirme" && a.date >= today()).sort((a, b) => (a.date + (a.time || "")).localeCompare(b.date + (b.time || ""))),
    proposed: mine.filter(a => a.status === "propose"),
    history: mine.slice().sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0))
  };
  const note = !specs.length ? `<div class="empty" style="margin-bottom:16px">Vous n'êtes rattaché à aucune spécialité : la direction doit vous en attribuer pour recevoir des demandes.</div>` : "";
  return head("Rendez-vous", "", isDir(u) ? "Vous voyez les demandes de toutes les spécialités." : "Demandes de vos spécialités : " + specs.map(specName).join(", ")) + note +
    subtabs([["todo", `À traiter (${sets.todo.length})`], ["upcoming", `À venir (${sets.upcoming.length})`], ["proposed", `En attente du patient (${sets.proposed.length})`], ["history", "Historique"]], sub) +

}

ACT.rdvAccept = t => openModal({kind: "rdvAct", mode: "accept", id: t.dataset.id});
ACT.rdvPropose = t => openModal({kind: "rdvAct", mode: "propose", id: t.dataset.id});
ACT.rdvRefuse = t => openModal({kind: "rdvAct", mode: "refuse", id: t.dataset.id});
ACT.rdvStaffCancel = t => confirmBox("Annuler ce rendez-vous ?", "Le patient verra le rendez-vous comme annulé.", "Annuler le rendez-vous", () => { const a = S.appointments[t.dataset.id]; patch("appointments", t.dataset.id, {status: "annule", log: logPush(a, "Annulé par " + nameOf(session))}); });
function rdvActModal(){

/* ---------- Dossiers patients ---------- */
function patientsList(u){
  const q = norm(T.ptq || "");
  const list = all("accounts").filter(a => a.id !== u.id).filter(a => !q || norm(fullName(a) + " " + a.id).includes(q)).sort((a, b) => (a.nom || "").localeCompare(b.nom || ""));
  return head("Dossiers patients", "", "Tous les patients, y compris les membres du personnel suivis à l'hôpital.") +
  `<div class="card"><input id="pt-q" type="search" placeholder="Rechercher un nom ou un identifiant" data-inp="ptq" value="${esc(T.ptq || "")}" style="margin-bottom:8px">
  <div class="list">${list.length ? list.map(a => `<div class="item" style="align-items:center">${avatar(a, "sm")}<div class="grow"><b>${esc(fullName(a))}</b> ${isStaff(a) ? pill("Personnel", "info") : ""}<div class="small muted"><span class="mono">${esc(a.id)}</span> · né(e) le ${fmtD((a.med || {}).naissance)}</div></div><button class="btn sm" data-act="go" data-p="space" data-tab="patients" data-param="${a.id}">Ouvrir le dossier</button></div>`).join("") : `<p class="muted small" style="padding:12px 0">Aucun résultat.</p>`}</div></div>`;
}
INP.ptq = t => { T.ptq = t.value; render(true); };

function dossier(u, pid){
  const p = acc(pid);
  if (!p) return `<div class="empty">Ce dossier n'existe plus. <button class="btn sm" data-act="go" data-p="space" data-tab="patients">Retour</button></div>`;
  const sub = ["fiche", "care", "notes", "docs", "rdv", "bill"].includes(V.sub) ? V.sub : "fiche";
  const views = {fiche: dFiche, care: dCare, notes: dNotes, docs: dDocs, rdv: dRdv, bill: dBill};
  return `<button class="btn sm ghost" data-act="go" data-p="space" data-tab="patients" style="margin-bottom:14px">← Tous les dossiers</button>
  <div class="dossierhead">${avatar(p)}<div><h2 style="font-size:1.6rem">${esc(fullName(p))}</h2><div class="small muted"><span class="mono">${esc(p.id)}</span> · ${esc(ROLES[p.role])}${(p.med || {}).groupe ? " · Groupe " + esc(p.med.groupe) : ""}</div></div>
  <div class="spacer"></div><button class="btn" data-act="newDoc" data-patient="${p.id}">${ICONS.plus}Nouveau document</button></div>` +
  subtabs([["fiche", "Fiche médicale"], ["care", "Soins et opérations"], ["notes", "Notes"], ["docs", "Documents"], ["rdv", "Rendez-vous"], ["bill", "Facturation"]], sub, `data-param="${p.id}"`) + views[sub](u, p);
}
function dFiche(u, p){
  const m = p.med || {};
  return `<form class="card stack" data-form="med" data-id="${p.id}">
    <div class="grid3"><label class="f">Date de naissance<input id="md-n" type="date" name="naissance" value="${esc(m.naissance || "")}"></label>
    <label class="f">Groupe sanguin<select id="md-g" name="groupe">${BLOOD.map(b => `<option ${b === m.groupe ? "selected" : ""} value="${b}">${b || "Non renseigné"}</option>`).join("")}</select></label>
    <label class="f">Contact d'urgence<input id="md-u" name="urgence" value="${esc(m.urgence || "")}" placeholder="Nom et téléphone"></label>
    <label class="f">Taille (cm)<input id="md-t" type="number" name="taille" min="30" max="250" value="${esc(m.taille || "")}"></label>
    <label class="f">Poids (kg)<input id="md-p" type="number" name="poids" min="1" max="400" value="${esc(m.poids || "")}"></label></div>
    <label class="f">Allergies<textarea id="md-a" name="allergies" style="min-height:60px">${esc(m.allergies || "")}</textarea></label>
    <label class="f">Antécédents<textarea id="md-h" name="antecedents">${esc(m.antecedents || "")}</textarea></label>
    <div class="row"><span class="small muted">${p.medBy ? `Dernière mise à jour le ${fmtDT(p.medAt)} par ${esc(nameOf(p.medBy))}` : "Fiche jamais remplie."}</span><span class="spacer"></span><button class="btn">Enregistrer la fiche</button></div></form>`;
}
FORM.med = (f, fd) => {
  const med = {}; ["naissance", "groupe", "urgence", "taille", "poids", "allergies", "antecedents"].forEach(k => med[k] = (fd.get(k) || "").trim());
  patch("accounts", f.dataset.id, {med, medBy: session, medAt: Date.now()}); toast("Fiche médicale enregistrée.");
};
function dCare(u, p){
  const list = all("care").filter(c => c.patient === p.id).sort((a, b) => (b.date || "").localeCompare(a.date || "") || b.at - a.at);
  return `<form class="card stack" data-form="care" data-id="${p.id}" style="margin-bottom:16px"><h3>Ajouter un soin ou une opération</h3><p class="small muted">Visible par tous vos collègues.</p>
    <div class="grid3"><label class="f">Date<input id="ca-d" type="date" name="date" value="${today()}" required></label><label class="f">Type<select id="ca-k" name="kind"><option>Soin</option><option>Opération</option><option>Examen</option><option>Intervention d'urgence</option></select></label><label class="f">Intitulé<input id="ca-t" name="title" required placeholder="Ex. Suture de l'arcade"></label></div>
    <label class="f">Détails<textarea id="ca-x" name="details" style="min-height:70px"></textarea></label><div class="row end"><button class="btn">Ajouter au dossier</button></div></form>
    ${list.length ? `<div class="card list">${list.map(c => `<div class="item"><div class="grow"><div class="row">${pill(c.kind, c.kind === "Opération" ? "warn" : "info")}<b>${esc(c.title)}</b></div><p class="small" style="margin-top:4px;white-space:pre-wrap">${esc(c.details)}</p><div class="small muted" style="margin-top:4px">${fmtD(c.date)} · ${esc(nameOf(c.author))}</div></div>${c.author === u.id ? `<button class="btn sm ghost" data-act="delItem" data-col="care" data-id="${c.id}">Supprimer</button>` : ""}</div>`).join("")}</div>` : `<div class="empty">Aucun soin enregistré.</div>`}`;
}
FORM.care = (f, fd) => { put("care", uid(), {patient: f.dataset.id, author: session, date: fd.get("date"), kind: fd.get("kind"), title: fd.get("title").trim(), details: fd.get("details").trim(), at: Date.now()}); f.reset(); render(); toast("Ajouté au dossier."); };
ACT.delItem = t => confirmBox("Supprimer cet élément ?", "Cette suppression est définitive.", "Supprimer", () => { del(t.dataset.col, t.dataset.id); toast("Supprimé."); });

function shareFields(prefix, cur){
  cur = cur || {share: "prive", sharedWith: []};
  const col = staffList().filter(a => a.id !== session);
  return `<div class="stack" style="gap:8px"><label class="f">Partage<select id="${prefix}-share" name="share"><option value="prive" ${cur.share === "prive" ? "selected" : ""}>Privé (moi seul)</option><option value="tous" ${cur.share === "tous" ? "selected" : ""}>Tous les collègues</option><option value="certains" ${cur.share === "certains" ? "selected" : ""}>Certains collègues</option></select></label>
  ${col.length ? `<div><span class="hint">Collègues choisis (si « Certains collègues ») :</span><div class="chips" style="margin-top:6px">${col.map(a => `<label><input type="checkbox" id="${prefix}-sw-${a.id}" name="sw" value="${a.id}" ${(cur.sharedWith || []).includes(a.id) ? "checked" : ""}>${esc(fullName(a))}</label>`).join("")}</div></div>` : ""}</div>`;
}
const readShare = fd => ({share: fd.get("share"), sharedWith: fd.get("share") === "certains" ? fd.getAll("sw") : []});
const shareLabel = i => i.share === "tous" ? pill("Partagé avec tous", "info") : i.share === "certains" ? pill("Partagé avec " + (i.sharedWith || []).length + " collègue(s)", "info") : pill("Privé");
function dNotes(u, p){
  const list = all("notes").filter(n => n.patient === p.id && canSee(n, u)).sort((a, b) => b.at - a.at);
  return `<form class="card stack" data-form="note" data-id="${p.id}" style="margin-bottom:16px"><h3>Nouvelle note professionnelle</h3><p class="small muted">Privée par défaut. Vous choisissez qui peut la lire.</p>
    <label class="f">Note<textarea id="nt-x" name="text" required></textarea></label>${shareFields("nt")}<div class="row end"><button class="btn">Enregistrer la note</button></div></form>
    ${list.length ? `<div class="stack">${list.map(n => `<div class="post"><div class="row">${avatar(acc(n.author), "sm")}<b>${esc(nameOf(n.author))}</b><span class="small muted">${fmtDT(n.at)}</span><span class="spacer"></span>${shareLabel(n)}</div><div class="body">${esc(n.text)}</div>
      ${n.author === u.id ? `<div class="row" style="margin-top:10px"><button class="btn sm ghost" data-act="editShare" data-col="notes" data-id="${n.id}">Modifier le partage</button><button class="btn sm ghost" data-act="delItem" data-col="notes" data-id="${n.id}">Supprimer</button></div>` : ""}</div>`).join("")}</div>` : `<div class="empty">Aucune note visible pour vous.</div>`}`;
}
FORM.note = (f, fd) => { put("notes", uid(), Object.assign({patient: f.dataset.id, author: session, text: fd.get("text").trim(), at: Date.now()}, readShare(fd))); f.reset(); render(); toast("Note enregistrée."); };
ACT.editShare = t => openModal({kind: "share", col: t.dataset.col, id: t.dataset.id});
function shareModal(){
  const it = S[M.col][M.id]; if (!it) return "";
  return `<div class="mhead"><h3>Partage et visibilité</h3><button class="btn sm ghost" data-act="close">Fermer</button></div>
  <form class="stack" data-form="share">${shareFields("sh", it)}
  ${M.col === "documents" ? `<label class="check"><input type="checkbox" id="sh-vis" name="vis" ${it.visibleToPatient ? "checked" : ""}>Visible par le patient dans son espace</label>` : ""}
  <div class="row end"><button class="btn">Enregistrer</button></div></form>`;
}
FORM.share = (f, fd) => { const extra = M.col === "documents" ? {visibleToPatient: !!fd.get("vis")} : {}; patch(M.col, M.id, Object.assign(readShare(fd), extra)); toast("Partage mis à jour."); closeModal(); };

function dDocs(u, p){
  const list = all("documents").filter(d => d.patient === p.id && canSee(d, u)).sort((a, b) => b.at - a.at);
  return list.length ? `<div class="card list">${list.map(d => `<div class="item"><div class="avatar sm" style="border-radius:8px">${ICONS.doc}</div><div class="grow"><b>${esc(DOC_TYPES[d.type].label)}</b>
    <div class="small muted">${fmtD(d.at)} · ${esc(nameOf(d.author))} · <span class="mono">${esc(d.ref)}</span></div>
    <div class="row" style="margin-top:6px;gap:6px">${d.visibleToPatient ? pill("Visible par le patient", "ok") : pill("Non visible par le patient")}${shareLabel(d)}${d.removedByPatient ? pill("Retiré par le patient", "warn") : ""}</div></div>
    <div class="row"><button class="btn sm" data-act="viewDoc" data-id="${d.id}">Ouvrir</button>${d.author === u.id ? `<button class="btn sm ghost" data-act="editShare" data-col="documents" data-id="${d.id}">Partage</button><button class="btn sm ghost" data-act="delItem" data-col="documents" data-id="${d.id}">Supprimer</button>` : ""}</div></div>`).join("")}</div>`
  : `<div class="empty">Aucun document visible pour vous. <button class="btn sm" data-act="newDoc" data-patient="${p.id}">Rédiger un document</button></div>`;
}
function dRdv(u, p){
  const list = all("appointments").filter(a => a.patient === p.id).sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  return list.length ? `<div class="card list">${list.map(a => rdvStaffItem(a, "history")).join("")}</div>` : `<div class="empty">Aucun rendez-vous.</div>`;
}
function dBill(u, p){
  const list = all("billing").filter(b => b.patient === p.id).sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  return `<div class="row end" style="margin-bottom:12px"><button class="btn" data-act="addCare" data-patient="${p.id}">${ICONS.plus}Ajouter un soin facturé</button></div>` + billTable(list, u, false);
}

/* ---------- Spécialités, espace commun : fils de discussion ---------- */
function specsView(u){
  const specs = mySpecs(u);
  if (!specs.length) return head("Spécialités") + `<div class="empty">Vous n'avez accès à aucun espace de spécialité. La direction attribue les spécialités dans Utilisateurs.</div>`;
  const sub = specs.includes(V.sub) ? V.sub : specs[0];
  const members = staffList().filter(a => (a.specs || []).includes(sub));
  return head("Spécialités", "", "Espaces confidentiels : seuls les membres du service et la direction y ont accès.") +
    subtabs(specs.map(s => [s, specName(s)]), sub) +
    `<p class="small muted" style="margin-bottom:12px">Membres : ${members.length ? members.map(a => esc(fullName(a))).join(", ") : "aucun"}</p>` + feed(u, "spec", sub);
}
function feed(u, col, spec){
  const key = col + "-" + (spec || "all");
  const posts = all(col).filter(p => !spec || p.spec === spec).sort((a, b) => b.at - a.at);
  const pend = T["att-" + key] || [];
  return `<form class="card stack" data-form="post" data-col="${col}" data-spec="${spec || ""}" data-key="${key}" style="margin-bottom:16px">
    <label class="f">Nouveau message<textarea id="cp-${key}" name="text" placeholder="Information, question, compte rendu d'équipe…"></textarea></label>
    ${pend.length ? `<div class="atts">${pend.map((a, i) => attHTML(a, `<button type="button" class="btn sm ghost" data-act="rmAtt" data-key="${key}" data-i="${i}">Retirer</button>`)).join("")}</div>` : ""}
    <div class="row"><label class="btn sm ghost" style="cursor:pointer">${ICONS.clip}Joindre image ou fichier<input type="file" multiple hidden data-chg="att" data-key="${key}"></label><span class="hint">3 pièces jointes maximum</span><span class="spacer"></span><button class="btn">Publier</button></div></form>
    ${posts.length ? `<div class="stack">${posts.map(p => `<article class="post"><div class="row">${avatar(acc(p.author), "sm")}<b>${esc(nameOf(p.author))}</b><span class="small muted">${fmtDT(p.at)}</span><span class="spacer"></span>${p.author === u.id || isDir(u) ? `<button class="btn sm ghost" data-act="delItem" data-col="${col}" data-id="${p.id}">Supprimer</button>` : ""}</div>
      ${p.text ? `<div class="body">${esc(p.text)}</div>` : ""}${(p.atts || []).length ? `<div class="atts">${p.atts.map(a => attHTML(a)).join("")}</div>` : ""}
      ${(p.replies || []).length ? `<div class="replies">${p.replies.map(r => `<div><b class="small">${esc(nameOf(r.author))}</b> <span class="small muted">${fmtDT(r.at)}</span><div class="small" style="white-space:pre-wrap">${esc(r.text)}</div></div>`).join("")}</div>` : ""}
      <form class="row" data-form="reply" data-col="${col}" data-id="${p.id}" style="margin-top:10px;flex-wrap:nowrap"><input id="rp-${p.id}" name="text" placeholder="Répondre…" required><button class="btn sm ghost">Répondre</button></form></article>`).join("")}</div>`
    : `<div class="empty">Aucun message pour le moment.</div>`}`;
}
function attHTML(a, extra){
  return a.kind === "image" ? `<span class="stack" style="gap:4px"><img src="${a.data}" alt="${esc(a.name)}" data-act="zoom" data-src="${esc(a.data)}">${extra || ""}</span>`
    : `<span class="row" style="gap:4px"><span class="att-file" data-act="dlAtt" data-name="${esc(a.name)}" data-src="${esc(a.data)}">${ICONS.clip}${esc(a.name)}</span>${extra || ""}</span>`;
}
CHG.att = async t => {
  const key = t.dataset.key; const cur = T["att-" + key] || [];
  for (const f of Array.from(t.files || [])) {
    if (cur.length >= 3) { toast("3 pièces jointes maximum par message."); break; }
    let a = null;
    if (f.type.startsWith("image/")) { const d = await compressTo(f, 1280, 70000); if (d) a = {kind: "image", name: f.name, data: d}; }
    else if (f.size > 52000) toast(f.name + " est trop lourd (50 Ko maximum pour un fichier).");
    else a = {kind: "file", name: f.name, data: await readFile(f)};
    if (a) cur.push(a);
  }
  T["att-" + key] = cur; t.value = ""; render(true);
};
ACT.rmAtt = t => { T["att-" + t.dataset.key].splice(+t.dataset.i, 1); render(true); };
ACT.zoom = t => openModal({kind: "zoom", src: t.dataset.src});
ACT.dlAtt = t => saveFile(t.dataset.name, dataURLtoBlob(t.dataset.src));
FORM.post = (f, fd) => {
  const key = f.dataset.key, text = (fd.get("text") || "").trim(), atts = T["att-" + key] || [];
  if (!text && !atts.length) return toast("Écrivez un message ou joignez un fichier.");
  const o = {author: session, text, atts, at: Date.now(), replies: []}; if (f.dataset.spec) o.spec = f.dataset.spec;
  put(f.dataset.col, uid(), o); T["att-" + key] = []; f.reset(); render(); toast("Publié.");
};
FORM.reply = (f, fd) => { const p = S[f.dataset.col][f.dataset.id]; patch(f.dataset.col, f.dataset.id, {replies: (p.replies || []).concat([{author: session, text: fd.get("text").trim(), at: Date.now()}])}); f.reset(); render(); };

/* ---------- Mon espace ---------- */
function persoView(u){
  const items = all("personal").filter(i => i.owner === u.id);
  const notes = items.filter(i => i.kind === "note").sort((a, b) => b.at - a.at), tasks = items.filter(i => i.kind === "task").sort((a, b) => (a.done - b.done) || b.at - a.at);
  return `<div class="grid2" style="align-items:start">
    <div class="stack"><form class="card stack" data-form="perso" data-kind="task"><h3>Tâches</h3><div class="row" style="flex-wrap:nowrap"><input id="ps-t" name="text" required placeholder="Nouvelle tâche"><button class="btn">Ajouter</button></div>
      <div class="list">${tasks.map(t => `<div class="item" style="align-items:center;padding:8px 0"><label class="check grow" style="${t.done ? "text-decoration:line-through;color:var(--muted)" : ""}"><input type="checkbox" data-chg="task" data-id="${t.id}" ${t.done ? "checked" : ""}>${esc(t.text)}</label><button class="btn sm ghost" data-act="delNow" data-col="personal" data-id="${t.id}" aria-label="Supprimer la tâche">×</button></div>`).join("") || `<p class="small muted">Aucune tâche.</p>`}</div></form></div>
    <div class="stack"><form class="card stack" data-form="perso" data-kind="note"><h3>Notes personnelles</h3><input id="ps-nt" name="title" placeholder="Titre"><textarea id="ps-nx" name="text" required placeholder="Votre note"></textarea><div class="row end"><button class="btn">Enregistrer</button></div></form>
      ${notes.map(n => `<div class="post"><div class="row"><b>${esc(n.title || "Sans titre")}</b><span class="small muted">${fmtD(n.at)}</span><span class="spacer"></span><button class="btn sm ghost" data-act="delItem" data-col="personal" data-id="${n.id}">Supprimer</button></div><div class="body">${esc(n.text)}</div></div>`).join("")}</div></div>`;
}
FORM.perso = (f, fd) => { put("personal", uid(), {owner: session, kind: f.dataset.kind, title: (fd.get("title") || "").trim(), text: fd.get("text").trim(), done: false, at: Date.now()}); f.reset(); render(); };
CHG.task = t => patch("personal", t.dataset.id, {done: t.checked});
ACT.delNow = t => del(t.dataset.col, t.dataset.id);

/* ---------- Paramètres ---------- */
function settingsView(u){
  return `<div class="stack" style="gap:18px;max-width:720px">
  <div class="card"><h3>Mon compte</h3><div class="fiche" style="margin-top:10px"><div><span>Nom</span><b>${esc(fullName(u))}</b></div><div><span>Identifiant</span><b class="mono">${esc(u.id)}</b></div><div><span>Statut</span><b>${esc(u.poste || ROLES[u.role])}</b></div></div>
  <p class="small muted" style="margin-top:10px">${isStaff(u) ? "Votre nom, votre poste et vos spécialités sont gérés par la direction." : "Seule la direction peut modifier votre nom. Vous pouvez changer votre mot de passe ci-dessous."}</p></div>
  ${isStaff(u) ? `<form class="card stack" data-form="profile"><h3>Ma fiche sur la page équipe</h3><p class="small muted">${u.role === "admin" ? "Votre compte n'apparaît pas sur la page équipe." : "Visible publiquement sur « Qui sommes-nous »."}</p>
    <div class="row">${avatar(Object.assign({}, u, {photo: T.photo !== undefined ? T.photo : u.photo}))}<label class="btn sm ghost" style="cursor:pointer">Choisir une photo<input type="file" accept="image/*" hidden data-chg="photo"></label>${(T.photo !== undefined ? T.photo : u.photo) ? `<button type="button" class="btn sm ghost" data-act="rmPhoto">Retirer la photo</button>` : ""}</div>
    <label class="f">Présentation<textarea id="pf-bio" name="bio" placeholder="Parcours, spécialités, ce qui vous anime…">${esc(u.bio || "")}</textarea></label><div class="row end"><button class="btn">Enregistrer ma fiche</button></div></form>` : ""}
  <form class="card stack" data-form="pw"><h3>Changer de mot de passe</h3>
    <label class="f">Mot de passe actuel<input id="pw-o" type="password" name="old" required autocomplete="current-password"></label>
    <div class="grid2"><label class="f">Nouveau mot de passe<input id="pw-n" type="password" name="pw" minlength="6" required autocomplete="new-password"></label><label class="f">Confirmer<input id="pw-c" type="password" name="pw2" required autocomplete="new-password"></label></div>
    <p class="err">${esc(T.pwErr || "")}</p><div class="row end"><button class="btn">Changer le mot de passe</button></div></form></div>`;
}
CHG.photo = async t => { const f = t.files[0]; if (!f) return; T.photo = await compressTo(f, 360, 40000); render(true); };
ACT.rmPhoto = () => { T.photo = ""; render(true); };
FORM.profile = (f, fd) => { const o = {bio: fd.get("bio").trim()}; if (T.photo !== undefined) o.photo = T.photo; patch("accounts", session, o); delete T.photo; toast("Fiche enregistrée."); };
FORM.pw = async (f, fd) => {
  const u = me();
  if (u.hash !== await hash(u.id, fd.get("old"))) { T.pwErr = "Le mot de passe actuel est incorrect."; return render(true); }
  if (fd.get("pw").length < 6) { T.pwErr = "6 caractères minimum."; return render(true); }
  if (fd.get("pw") !== fd.get("pw2")) { T.pwErr = "Les deux mots de passe ne correspondent pas."; return render(true); }
  patch("accounts", u.id, {hash: await hash(u.id, fd.get("pw"))}); T.pwErr = ""; f.reset(); render(); toast("Mot de passe modifié.");
};

/* ---------- Modale générique ---------- */
function confirmBox(title, text, btn, run){ openModal({kind: "confirm", title, text, btn, run}); }
ACT.confirmRun = () => { const f = M.run; M = null; f(); render(true); };
function modal(){
  let inner = "", wide = false;
  if (M.kind === "confirm") inner = `<div class="mhead"><h3>${esc(M.title)}</h3></div><p class="muted">${esc(M.text)}</p><div class="row end" style="margin-top:20px"><button class="btn ghost" data-act="close">Retour</button><button class="btn danger" data-act="confirmRun">${esc(M.btn)}</button></div>`;
  else if (M.kind === "rdvAct") inner = rdvActModal();
  else if (M.kind === "share") inner = shareModal();

  toast("Préparation du fichier…");

  const canvas = await html2canvas(el, {scale: 2, backgroundColor: "#ffffff", useCORS: true, logging: false});

    pdf.addImage(canvas.toDataURL("image/jpeg", .92), "JPEG", 0, 0, 210, Math.min(h, 297));
    await saveFile(name, pdf.output("blob"));
  } else {
    const blob = await new Promise(r => canvas.toBlob(r, "image/png"));
    await saveFile(name.replace(/\.pdf$/, ".png"), blob);
  }
};

function weekStats(w){
  const b = all("billing").filter(x => inWeek(x.date, w));
  const pr = S.payroll[w.key] || {};
  const endMs = w.end.getTime() + 86400000;
  const staff = staffList().filter(a => (a.createdAt || 0) <= endMs);
  const payOf = a => pr.paid && pr.paid[a.id] != null ? pr.paid[a.id] : (+a.pay || 0);
  const ca = sum(b, x => x.amount), enc = sum(b.filter(x => x.paid), x => x.amount);
  const sal = sum(staff, payOf);
  const rate = pr.taxPaid && pr.taxRate != null ? pr.taxRate : (+cfg().taxRate || 0);
  const tax = Math.round(ca * rate / 100);
  return {w, b, pr, staff, payOf, ca, enc, sal, rate, tax, net: enc - sal - tax};
}
function bars(data, fmt){
  const max = Math.max(1, ...data.map(d => d.v));

}
function comptaView(u){
  const sub = isDir(u) && V.sub === "exo" ? "exo" : "mg";
  const tabs = subtabs([["mg", "Médecine générale"]].concat(isDir(u) ? [["exo", "Exercice & paye"]] : []), sub);
  if (sub === "mg") {
    const list = all("billing").sort((a, b) => (b.date || "").localeCompare(a.date || "") || b.at - a.at);
    const enc = sum(list.filter(b => b.paid), b => b.amount), due = sum(list.filter(b => !b.paid), b => b.amount);
    return head("Comptabilité", `<button class="btn" data-act="addCare" aria-label="Ajouter un soin">${ICONS.plus}Ajouter un soin</button>`) + tabs +
      `<div class="kpis"><div class="kpi pos"><span>Encaissé</span><b>${money(enc)}</b></div><div class="kpi ${due ? "neg" : ""}"><span>À encaisser</span><b>${money(due)}</b></div><div class="kpi"><span>Total facturé</span><b>${money(enc + due)}</b></div></div>` + billTable(list, u, true);
  }
  const w = shiftWeek(weekOf(), +(T.wk || 0)), s = weekStats(w);
  const hist = Array.from({length: 8}, (_, i) => weekStats(shiftWeek(w, i - 7)));
  return head("Comptabilité") + tabs + `
  <div class="row" style="margin-bottom:16px"><button class="btn sm ghost" data-act="wk" data-d="-1">← Semaine précédente</button><b style="font-family:var(--f-display);font-size:1.1rem">${weekLabel(w)}</b><button class="btn sm ghost" data-act="wk" data-d="1">Semaine suivante →</button>${T.wk ? `<button class="btn sm ghost" data-act="wk" data-d="0">Cette semaine</button>` : ""}</div>
  <div class="kpis"><div class="kpi"><span>Chiffre d'affaires</span><b>${money(s.ca)}</b></div><div class="kpi"><span>Encaissé</span><b>${money(s.enc)}</b></div><div class="kpi"><span>Salaires</span><b>${money(s.sal)}</b></div><div class="kpi"><span>Impôts (${s.rate} %)</span><b>${money(s.tax)}</b></div><div class="kpi ${s.net < 0 ? "neg" : "pos"}"><span>Résultat net</span><b>${money(s.net)}</b></div></div>
  <div class="grid2" style="align-items:start;margin-bottom:18px">
    <div class="card"><h3>Chiffre d'affaires sur 8 semaines</h3>${bars(hist.map((h, i) => ({label: "S" + h.w.week, v: h.ca, cur: i === 7})), money)}</div>
    <div class="card stack"><h3>Impôts de la semaine</h3>
      <form class="row" data-form="taxRate" style="flex-wrap:nowrap"><label class="f" style="flex:1">Taux d'impôts (%)<input id="tx-r" type="number" name="rate" min="0" max="100" step="0.5" value="${+cfg().taxRate || 0}"></label><button class="btn ghost" style="align-self:flex-end">Enregistrer le taux</button></form>
      <div class="row"><span>Montant : <b class="num">${money(s.tax)}</b></span><span class="spacer"></span>${s.pr.taxPaid ? `${pill("Impôts payés", "ok")}<button class="btn sm ghost" data-act="taxPaid" data-k="${w.key}" data-v="0">Annuler</button>` : `<button class="btn sm" data-act="taxPaid" data-k="${w.key}" data-v="1">Marquer les impôts payés</button>`}</div>
      <p class="hint">Impôts = chiffre d'affaires de la semaine × taux. Une fois marqués payés, le montant de la semaine est figé.</p></div>
  </div>
  <div class="card" style="margin-bottom:18px"><h3>Paye de la semaine</h3><p class="small muted" style="margin-bottom:10px">Fixez la paye hebdomadaire de chacun, puis marquez-la payée.</p>
    ${s.staff.length ? `<div class="tablewrap"><table><thead><tr><th>Employé</th><th>Poste</th><th>Paye hebdo ($)</th><th style="text-align:right">CA généré</th><th>Statut</th></tr></thead><tbody>
    ${s.staff.map(a => { const paid = s.pr.paid && s.pr.paid[a.id] != null; return `<tr><td>${esc(fullName(a))}</td><td class="small">${esc(a.poste || ROLES[a.role])}</td>
      <td><input id="pay-${a.id}" type="number" min="0" step="1" value="${+a.pay || 0}" data-chg="setPay" data-id="${a.id}" style="max-width:120px" ${paid ? "disabled" : ""}></td>
      <td class="num" style="text-align:right">${money(sum(s.b.filter(x => x.author === a.id), x => x.amount))}</td>
      <td>${paid ? `${pill("Payé · " + money(s.pr.paid[a.id]), "ok")} <button class="btn sm ghost" data-act="payMark" data-k="${w.key}" data-id="${a.id}" data-v="0">Annuler</button>` : `<button class="btn sm" data-act="payMark" data-k="${w.key}" data-id="${a.id}" data-v="1">Marquer payé</button>`}</td></tr>`; }).join("")}
    </tbody></table></div>` : `<div class="empty">Aucun employé.</div>`}</div>
  <div class="card tablewrap"><h3 style="margin-bottom:8px">Historique sur 8 semaines</h3><table><thead><tr><th>Semaine</th><th style="text-align:right">CA</th><th style="text-align:right">Encaissé</th><th style="text-align:right">Salaires</th><th style="text-align:right">Impôts</th><th style="text-align:right">Résultat net</th></tr></thead><tbody>
    ${hist.slice().reverse().map(h => `<tr><td>${weekLabel(h.w)}</td><td class="num" style="text-align:right">${money(h.ca)}</td><td class="num" style="text-align:right">${money(h.enc)}</td><td class="num" style="text-align:right">${money(h.sal)}</td><td class="num" style="text-align:right">${money(h.tax)} ${h.pr.taxPaid ? "✓" : ""}</td><td class="num" style="text-align:right;font-weight:700;color:${h.net < 0 ? "var(--err)" : "var(--ok)"}">${money(h.net)}</td></tr>`).join("")}
  </tbody></table></div>`;
}
ACT.wk = t => { T.wk = t.dataset.d === "0" ? 0 : (T.wk || 0) + (+t.dataset.d); render(true); };
CHG.setPay = t => { patch("accounts", t.dataset.id, {pay: Math.max(0, +t.value || 0)}); toast("Paye de " + nameOf(t.dataset.id) + " enregistrée."); };
FORM.taxRate = (f, fd) => { put("config", "site", Object.assign({}, S.config.site || {}, {taxRate: +fd.get("rate") || 0})); toast("Taux d'impôts enregistré."); };
function payrollDoc(k){ return JSON.parse(JSON.stringify(S.payroll[k] || {paid: {}, paidAt: {}})); }
ACT.payMark = t => {
  const k = t.dataset.k, d = payrollDoc(k); d.paid = d.paid || {}; d.paidAt = d.paidAt || {};
  if (t.dataset.v === "1") { d.paid[t.dataset.id] = +(S.accounts[t.dataset.id] || {}).pay || 0; d.paidAt[t.dataset.id] = Date.now(); }
  else { delete d.paid[t.dataset.id]; delete d.paidAt[t.dataset.id]; }
  put("payroll", k, d);
};
ACT.taxPaid = t => {
  const k = t.dataset.k, d = payrollDoc(k);
  if (t.dataset.v === "1") { const w = shiftWeek(weekOf(), +(T.wk || 0)); const s = weekStats(w); d.taxPaid = true; d.taxRate = s.rate; d.taxAmount = s.tax; d.taxPaidAt = Date.now(); }
  else { d.taxPaid = false; delete d.taxRate; delete d.taxAmount; }
  put("payroll", k, d);
};

function payeView(u){
  const w = weekOf(), hist = Array.from({length: 8}, (_, i) => shiftWeek(w, i - 7));
  const row = wk => { const pr = S.payroll[wk.key] || {}; const paid = pr.paid && pr.paid[u.id] != null; return {wk, pay: paid ? pr.paid[u.id] : (+u.pay || 0), paid, at: paid && pr.paidAt ? pr.paidAt[u.id] : null, ca: sum(all("billing").filter(b => b.author === u.id && inWeek(b.date, wk)), b => b.amount)}; };
  const cur = row(w), rows = hist.map(row);
  return head("Ma paye", "", weekLabel(w)) +
  `<div class="kpis"><div class="kpi"><span>Paye de la semaine</span><b>${money(cur.pay)}</b><div style="margin-top:6px">${cur.paid ? pill("Payée le " + fmtD(cur.at), "ok") : pill("En attente", "warn")}</div></div><div class="kpi"><span>Chiffre d'affaires généré</span><b>${money(cur.ca)}</b></div><div class="kpi"><span>Total versé sur 8 semaines</span><b>${money(sum(rows.filter(r => r.paid), r => r.pay))}</b></div></div>
  <div class="grid2" style="align-items:start"><div class="card"><h3>CA généré sur 8 semaines</h3>${bars(rows.map((r, i) => ({label: "S" + r.wk.week, v: r.ca, cur: i === 7})), money)}</div>
  <div class="card tablewrap"><h3 style="margin-bottom:8px">Historique</h3><table><thead><tr><th>Semaine</th><th style="text-align:right">Paye</th><th>Statut</th><th style="text-align:right">CA généré</th></tr></thead><tbody>
  ${rows.slice().reverse().map(r => `<tr><td>S${r.wk.week} · ${pad(r.wk.start.getDate())}/${pad(r.wk.start.getMonth() + 1)}</td><td class="num" style="text-align:right">${money(r.pay)}</td><td>${r.paid ? pill("Payée", "ok") : pill("Non payée")}</td><td class="num" style="text-align:right">${money(r.ca)}</td></tr>`).join("")}</tbody></table></div></div>`;
}

  `<div class="card"><div class="row" style="margin-bottom:10px;flex-wrap:nowrap"><input id="us-q" type="search" placeholder="Rechercher" data-inp="uq" value="${esc(T.uq || "")}"><select id="us-r" data-chg="urole" style="max-width:200px"><option value="">Tous les comptes</option><option value="staff" ${rf === "staff" ? "selected" : ""}>Personnel</option><option value="patient" ${rf === "patient" ? "selected" : ""}>Patients</option></select></div>

INP.uq = t => { T.uq = t.value; render(true); };
CHG.urole = t => { T.urole = t.value; render(true); };
ACT.userNew = () => openModal({kind: "user", pw: genPass()});
ACT.userEdit = t => openModal({kind: "user", id: t.dataset.id});
function userModal(){
  if (M.created) return `<div class="mhead"><h3>Compte créé</h3><button class="btn sm ghost" data-act="close">Fermer</button></div>
    <p>Transmettez ces informations à ${esc(M.created.name)}. Le mot de passe devra être changé à la première connexion.</p>
    <div class="fiche" style="margin-top:14px"><div><span>Identifiant</span><b class="mono">${esc(M.created.username)}</b></div><div><span>Mot de passe provisoire</span><b class="mono">${esc(M.created.pw)}</b></div></div>
    <div class="row end" style="margin-top:16px"><button class="btn ghost" data-act="copyCreds">Copier</button><button class="btn" data-act="close">Terminé</button></div>`;
  const a = M.id ? acc(M.id) : null, edit = !!a, self = edit && a.id === session;
  const specs = cfg().specs, cur = a ? (a.specs || []) : [];
  return `<div class="mhead"><h3>${edit ? "Modifier " + esc(fullName(a)) : "Nouvel employé"}</h3><button class="btn sm ghost" data-act="close">Fermer</button></div>
  <form class="stack" data-form="user">
    <div class="grid2"><label class="f">Nom<input id="um-nom" name="nom" required value="${esc(a ? a.nom : "")}" ${edit ? "" : `data-inp="umId"`}></label><label class="f">Prénom<input id="um-pre" name="prenom" required value="${esc(a ? a.prenom : "")}" ${edit ? "" : `data-inp="umId"`}></label></div>
    <p class="hint">Identifiant : <b class="mono" id="um-id">${edit ? esc(a.id) : "nom.prenom"}</b>${edit ? " (l'identifiant de connexion ne change pas)" : ""}</p>
    <div class="grid2"><label class="f">Rôle<select id="um-role" name="role" ${self ? "disabled" : ""}>${Object.entries(ROLES).filter(([k]) => edit || k !== "patient").map(([k, l]) => `<option value="${k}" ${(a ? a.role : "employe") === k ? "selected" : ""}>${k === "admin" ? "Administratrice (masquée de l'équipe)" : l}</option>`).join("")}</select></label>
    <label class="f">Poste<input id="um-poste" name="poste" value="${esc(a ? a.poste || "" : "")}" placeholder="Ex. Médecin urgentiste"></label></div>
    <div><span class="f">Spécialités (espaces confidentiels et demandes de rendez-vous)</span><div class="chips" style="margin-top:6px">${specs.map(s => `<label><input type="checkbox" id="um-s-${slug(s)}" name="specs" value="${slug(s)}" ${cur.includes(slug(s)) ? "checked" : ""}>${esc(s)}</label>`).join("")}</div><p class="hint" style="margin-top:6px">La première spécialité cochée sert de service principal sur la page équipe.</p></div>
    <label class="f">Paye hebdomadaire ($)<input id="um-pay" type="number" name="pay" min="0" step="1" value="${a ? +a.pay || 0 : 0}"></label>
    ${edit ? "" : `<label class="f">Mot de passe provisoire<input id="um-pw" name="pw" required minlength="6" value="${esc(M.pw)}"></label>`}
    <p class="err">${esc(M.err || "")}</p>
    <div class="row end"><button class="btn">${edit ? "Enregistrer" : "Créer le compte"}</button></div>
  </form>
  ${edit ? `<div class="card" style="margin-top:18px;background:var(--surface-2);border-color:transparent"><h3>Sécurité</h3>
    ${M.reset ? `<p style="margin-top:6px">Nouveau mot de passe provisoire : <b class="mono">${esc(M.reset)}</b></p>` : ""}
    <div class="row" style="margin-top:10px"><button class="btn sm ghost" data-act="userReset">Réinitialiser le mot de passe</button>
    ${self ? "" : M.armDel ? `<span class="small err">Supprimer définitivement ce compte ?</span><button class="btn sm danger" data-act="userDel">Oui, supprimer</button><button class="btn sm ghost" data-act="userDelCancel">Non</button>` : `<button class="btn sm ghost" data-act="userDelArm" style="color:var(--err)">Supprimer le compte</button>`}</div></div>` : ""}`;
}
INP.umId = () => { const n = document.getElementById("um-nom").value, p = document.getElementById("um-pre").value; document.getElementById("um-id").textContent = n && p ? slug(n) + "." + slug(p) : "nom.prenom"; };
FORM.user = async (f, fd) => {
  const nom = fd.get("nom").trim(), prenom = fd.get("prenom").trim();
  const specs = fd.getAll("specs"), poste = fd.get("poste").trim(), pay = Math.max(0, +fd.get("pay") || 0);
  if (M.id) {
    if (nameTaken(nom, prenom, M.id)) { M.err = "Un autre compte porte déjà ce nom."; return render(true); }
    const o = {nom, prenom, specs, poste, pay}; if (M.id !== session) o.role = fd.get("role");
    patch("accounts", M.id, o); toast("Compte mis à jour."); return closeModal();
  }
  const username = slug(nom) + "." + slug(prenom);
  if (!slug(nom) || !slug(prenom)) { M.err = "Indiquez un nom et un prénom."; return render(true); }
  if (nameTaken(nom, prenom)) { M.err = "Un compte existe déjà à ce nom (dans un ordre ou une orthographe proche)."; return render(true); }
  const pw = fd.get("pw");
  if (pw.length < 6) { M.err = "Le mot de passe provisoire doit faire au moins 6 caractères."; return render(true); }
  put("accounts", username, {nom, prenom, role: fd.get("role"), poste, specs, pay, hash: await hash(username, pw), mustChange: true, med: {}, createdAt: Date.now()});
  M = {kind: "user", created: {username, pw, name: prenom + " " + nom}}; render(true);
};
ACT.copyCreds = () => { const c = M.created; const txt = `Identifiant : ${c.username}\nMot de passe provisoire : ${c.pw}`; navigator.clipboard.writeText(txt).then(() => toast("Copié."), () => toast("Copie impossible : sélectionnez le texte.")); };
ACT.userReset = async () => { const pw = genPass(); patch("accounts", M.id, {hash: await hash(M.id, pw), mustChange: true}); M.reset = pw; render(true); };
ACT.userDelArm = () => { M.armDel = true; render(true); };
ACT.userDelCancel = () => { M.armDel = false; render(true); };
ACT.userDel = () => { del("accounts", M.id); toast("Compte supprimé."); closeModal(); };

    <div class="card"><div class="row" style="margin-bottom:8px"><h3>Postes publiés</h3><span class="spacer"></span><button class="btn sm" data-act="jobNew">${ICONS.plus}Publier un poste</button></div>
      <div class="list">${jobs.map(j => `<div class="item"><div class="grow"><b>${esc(j.title)}</b> ${j.service ? pill(j.service, "info") : ""}<p class="small muted">${esc(j.desc || "")}</p></div><button class="btn sm ghost" data-act="delItem" data-col="jobs" data-id="${j.id}">Retirer</button></div>`).join("") || `<p class="small muted">Aucun poste publié.</p>`}</div></div></div>
  <div class="card"><h3 style="margin-bottom:6px">Candidatures</h3>${apps.length ? `<div class="list">${apps.map(a => `<div class="item"><div class="grow"><div class="row">${pill(APP_ST[a.status][0], APP_ST[a.status][1])}<b>${esc(a.name)}</b><span class="small muted">${esc(a.job)} · ${fmtD(a.at)}</span></div><div class="small" style="margin-top:4px">Contact : <b>${esc(a.contact)}</b></div><p class="small muted" style="margin-top:4px;white-space:pre-wrap">${esc(a.text)}</p></div>
    <div class="row">${a.status !== "entretien" ? `<button class="btn sm ghost" data-act="appSt" data-id="${a.id}" data-s="entretien">Entretien</button>` : ""}${a.status !== "acceptee" ? `<button class="btn sm ok" data-act="appSt" data-id="${a.id}" data-s="acceptee">Accepter</button>` : ""}${a.status !== "refusee" ? `<button class="btn sm ghost" data-act="appSt" data-id="${a.id}" data-s="refusee">Refuser</button>` : ""}<button class="btn sm ghost" data-act="delItem" data-col="applications" data-id="${a.id}" aria-label="Supprimer">×</button></div></div>`).join("")}</div>` : `<div class="empty">Aucune candidature.</div>`}</div>`;
}
ACT.recToggle = () => { saveCfg({recruitOpen: !cfg().recruitOpen}); toast(cfg().recruitOpen ? "Recrutements ouverts." : "Recrutements fermés."); };
FORM.recText = (f, fd) => { saveCfg({recruitText: fd.get("text").trim(), recruitClosedMsg: fd.get("closedMsg").trim(), recruitOpenMsg: fd.get("openMsg").trim()}); toast("Texte enregistré."); };
ACT.appSt = t => patch("applications", t.dataset.id, {status: t.dataset.s});
ACT.jobNew = () => openModal({kind: "job"});
function jobModal(){
  return `<div class="mhead"><h3>Publier un poste</h3><button class="btn sm ghost" data-act="close">Fermer</button></div>
  <form class="stack" data-form="job"><label class="f">Intitulé<input id="jb-t" name="title" required placeholder="Ex. Infirmier(e) de nuit"></label>
  <label class="f">Service<select id="jb-s" name="service"><option value="">—</option>${cfg().specs.map(s => `<option>${esc(s)}</option>`).join("")}</select></label>
  <label class="f">Description<textarea id="jb-d" name="desc"></textarea></label><div class="row end"><button class="btn">Publier</button></div></form>`;
}
FORM.job = (f, fd) => { put("jobs", uid(), {title: fd.get("title").trim(), service: fd.get("service"), desc: fd.get("desc").trim(), at: Date.now()}); toast("Poste publié."); closeModal(); };

/* ---------- Démarrage ---------- */
render();
initStore();

</script>
</body></html>
